
#================================================================#
#        Healthy-API God-Mode Configuration Example             #
#================================================================#

services:
  # Service 1: Critical API with complex nested conditions
  - name: "Production Gateway"
    url: "https://api.my-company.com/health"
    condition_id: "complex-nested-check"
    check_period: 30
    sleep_on_fail: 60
    threshold: 3
    notify_on_recovery: true
    targets:
      - notifier_id: "slack-alerts"
        recipients: ["https://hooks.slack.com/services/T000/B000/XXXX"]
      - notifier_id: "on-call-sms"
        recipients: ["+1234567890"]

  # Service 2: A simple website check with custom user agent
  - name: "Main Website"
    url: "https://www.my-company.com"
    condition_id: "fast-200-ok"
    check_period: 60
    user_agent: "HealthyAPI-Monitor/2.0"
    targets:
      - notifier_id: "team-email"
        recipients: ["dev-team@my-company.com"]

#================================================================#
#        Notification Channel Configuration                     #
#================================================================#
notifiers:
  # ------ Webhooks (Slack/Discord/Custom) ------
  webhook:
    - id: "slack-alerts"
      method: POST
      headers:
        Content-Type: "application/json"
      json:
        # Generic fallback
        text: "⚠️ Alert for {{.Metadata.ServiceName}}"
      templates:
        network_error:    '{"text": "🔌 *Network Error*: Cannot reach {{.Metadata.ServiceName}}! Reason: {{.Metadata.Reason}}"}'
        http_error:       '{"text": "❌ *HTTP Error*: {{.Metadata.ServiceName}} returned {{.Metadata.StatusCode}}."}'
        slow_response:    '{"text": "⏱️ *Latency Alert*: {{.Metadata.ServiceName}} took {{.Metadata.ResponseTime}}."}'
        condition_failed: '{"text": "🔍 *Logic Failure*: {{.Metadata.ServiceName}} failed health criteria.\n```\n{{.Metadata.Reason}}\n```"}'
        recovery:         '{"text": "✅ *Service Restored*: {{.Metadata.ServiceName}} is back online!"}'
        default:          '{"text": "🔔 *Status Update*: {{.Metadata.ServiceName}} is {{.Metadata.Status}}"}'

  # ------ Email (SMTP) ------
  smtp:
    - id: "team-email"
      sender: "monitoring@my-company.com"
      password: "secret-password"
      server: "smtp.gmail.com"
      port: "587"
      templates:
        recovery: "Subject: ✅ Service {{.Metadata.ServiceName}} Recovered\n\nGood news! Service is back up."
        default:  "Subject: 🚨 Alert: {{.Metadata.ServiceName}} is {{.Metadata.Status}}\n\nReason: {{.Metadata.Reason}}"

  # ------ SMS (MeliPayamak) ------
  meli_payamak_panel:
    - id: "sms-admin"
      username: "myuser"
      password: "mypassword"
      sender: "50001234"
      templates:
        recovery: "✅ سرویس {{.Metadata.ServiceName}} به وضعیت عادی بازگشت."
        default:  "⚠️ هشدار: {{.Metadata.ServiceName}} دچار اختلال شده است. وضعیت: {{.Metadata.Status}}"

#================================================================#
#        Health Check Conditions                                #
#================================================================#
conditions:
  # Simple 200 OK + Fast response
  - id: "fast-200-ok"
    condition:
      and:
        - status_code: { code: 200 }
        - response_time: { max_duration: "1s" }

  # Complex AND inside OR (Highly Extensible)
  - id: "complex-nested-check"
    condition:
      or:
        # Path A: Normal Operational State
        - and:
            - status_code: { code: 200 }
            - regex: { pattern: '"status": ?"UP"' }
        # Path B: Maintenance Mode (Also considered Healthy if configured so)
        - and:
            - status_code: { code: 503 }
            - regex: { pattern: "MAINTENANCE_ACTIVE" }
